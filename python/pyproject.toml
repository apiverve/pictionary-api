[project]
name = "apiverve-pictionarygenerator"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Pictionary Generator creates random drawing prompts filtered by difficulty level for the classic Pictionary sketching game."
keywords = ["pictionary", "drawing game", "word prompts", "drawing prompts", "party game"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/pictionary?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/pictionary?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/pictionary-api"
Twitter = "https://twitter.com/apivervehq"
